<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Untitled Capybara Game — Sydney</title>
<!-- A capybara, at 32 px, in the palette. Inline so the game stays a single
     file with no external asset of any kind — and so the browser stops asking
     for /favicon.ico, which is the only console error this game has ever had
     and which any player who opens the console will see first. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cfe8ef'/%3E%3Cellipse cx='15' cy='21' rx='10' ry='6.5' fill='%23b0784a'/%3E%3Ccircle cx='23' cy='15' r='6' fill='%23c79063'/%3E%3Crect x='25' y='14' width='5' height='4.5' rx='2' fill='%23b0784a'/%3E%3Ccircle cx='20' cy='10' r='2.2' fill='%238a5a37'/%3E%3Ccircle cx='25.5' cy='10.5' r='2.2' fill='%238a5a37'/%3E%3Ccircle cx='25' cy='14' r='1.3' fill='%232f2118'/%3E%3Ccircle cx='29.4' cy='16.2' r='1.1' fill='%235f3d29'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#cfe8ef; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  #boot { position:fixed; inset:0; background:#cfe8ef; display:flex; align-items:center;
          justify-content:center; flex-direction:column; gap:14px; z-index:50;
          transition:opacity .6s ease; color:#5c6b52; }
  #boot h1 { font-size:clamp(22px,4vw,40px); letter-spacing:.02em; font-weight:700; color:#6b7c5e; }
  #boot .sub { font-size:14px; opacity:.7; }
  #boot.hidden { opacity:0; pointer-events:none; }
  #err { position:fixed; left:0; right:0; bottom:0; max-height:45%; overflow:auto; z-index:99;
         background:#3a3229; color:#ffd9a0; font:12px/1.5 ui-monospace,Consolas,monospace;
         padding:10px 14px; white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<div id="boot"><h1>Untitled Capybara Game</h1><div class="sub">warming up the harbour…</div></div>
<div id="hud"></div>
<pre id="err"></pre>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('error', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += (e.message || e.error) + '\n  ' + (e.filename||'') + ':' + (e.lineno||'') + '\n';
  });
  window.addEventListener('unhandledrejection', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
  });
</script>
</body>
</html>

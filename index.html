<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- NO `maximum-scale=1, user-scalable=no`, AND THE GAME DOES NOT NEED IT.
     Blocking pinch-zoom document-wide is WCAG 1.4.4 (Resize Text), and here it
     was buying nothing that was not already bought per element: the canvas is
     `touch-action:none`, so a pinch on the world does not zoom the page, and
     every control in the HUD is `touch-action:manipulation`, which is what
     kills the double-tap-to-zoom delay on a button. The only thing the meta
     added on top of those was stopping a player enlarging the JOURNAL, the
     SETTINGS SHEET and the TO-DO CARD — the three places in the game that are
     actually made of text, and the exact thing somebody pinches a phone for.
     The touch layer holds one MENU button and no drag-stick, so there is no
     gesture left for a stray pinch to interrupt. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled Capybara Game — Sydney</title>
<meta name="description" content="A physics sandbox where a mischievous capybara terrorises nineteen places.">
<meta name="theme-color" content="#cfe8ef">
<!-- A capybara, at 32 px, in the palette. Inline so the game stays a single
     file with no external asset of any kind — and so the browser stops asking
     for /favicon.ico, which is the only console error this game has ever had
     and which any player who opens the console will see first. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cfe8ef'/%3E%3Cellipse cx='15' cy='21' rx='10' ry='6.5' fill='%23b0784a'/%3E%3Ccircle cx='23' cy='15' r='6' fill='%23c79063'/%3E%3Crect x='25' y='14' width='5' height='4.5' rx='2' fill='%23b0784a'/%3E%3Ccircle cx='20' cy='10' r='2.2' fill='%238a5a37'/%3E%3Ccircle cx='25.5' cy='10.5' r='2.2' fill='%238a5a37'/%3E%3Ccircle cx='25' cy='14' r='1.3' fill='%232f2118'/%3E%3Ccircle cx='29.4' cy='16.2' r='1.1' fill='%235f3d29'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#cfe8ef; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  /* ---- THE BOOT CARD IS THE SAME PIECE OF PAPER NOW (D6) -----------------
     It was a self-contained mini design system: its own colours, its own type
     scale, a rotating ring spinner, and no relationship to the card the game
     opens with three hundred milliseconds later. On a slow connection it is
     the ONLY screen a player sees, and it looked like a different product's
     loading page.
     It is the title card's own recipe, hand-copied — and hand-copied is the
     point rather than an apology. This markup runs BEFORE main.js, before the
     import map resolves, before a single module is fetched: nothing in
     src/ can reach it, and a boot screen that depends on the thing it is
     waiting for is not a boot screen. The numbers below are the ones in
     sysBuildCSS (.capyui-card and .capyui-orn); if either moves, move both. */
  #boot { position:fixed; inset:0; display:flex; align-items:center;
          justify-content:center; flex-direction:column; z-index:50;
          transition:opacity .6s ease; padding:24px; text-align:center;
          background:linear-gradient(180deg,rgba(207,232,239,.34) 0%,
            rgba(207,232,239,.62) 38%,rgba(223,242,242,.84) 100%),#cfe8ef; }
  #boot .sheet { position:relative; background:#faf6ec;
          background-image:linear-gradient(158deg,#faf6ec 0%,rgba(228,211,173,.34) 100%),
            repeating-linear-gradient(92deg,rgba(181,171,151,.05) 0 1px,transparent 1px 4px);
          border:1px solid #e6dfcd; border-radius:7px;
          /* three shadows: the contact, the form and the room */
          box-shadow:0 2px 5px rgba(0,0,0,.13),0 10px 22px rgba(0,0,0,.16),
            0 34px 70px rgba(0,0,0,.28),0 2px 0 rgba(250,246,236,.9) inset,
            0 0 0 1px rgba(181,171,151,.22);
          padding:clamp(20px,4vw,40px) clamp(22px,5vw,54px);
          transform:rotate(-.8deg); max-width:520px; width:100%; }
  /* ...and the second sheet under it. A single sheet with a shadow is a dialog
     box with a rotation on it; two is a stack, and a stack is an object. */
  #boot .sheet:before { content:""; position:absolute; z-index:-1;
          left:8px; right:-6px; top:10px; bottom:-8px; border-radius:7px;
          background:rgba(230,223,205,.94); border:1px solid rgba(181,171,151,.3);
          transform:rotate(1.25deg);
          box-shadow:0 1px 3px rgba(0,0,0,.16),0 6px 16px rgba(0,0,0,.16); }
  #boot h1 { font-size:clamp(24px,6.2vw,46px); line-height:1.05; color:#3a332c;
          font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  #boot .sub { margin-top:6px; font-size:clamp(11px,2.4vw,14px); letter-spacing:.42em;
          text-transform:uppercase; color:#9e5f53; font-weight:700; }
  #boot.hidden { opacity:0; pointer-events:none; }

  /* ---- THE SPINNER IS THE ORNAMENT, BREATHING ---------------------------
     A rotating ring is the one shape in this whole product that says
     "framework". The title card's masthead device is a capybara between two
     hairline rules, breathing at five seconds a cycle — one and a half pixels,
     under the threshold at which anybody would call it an animation and well
     over the one at which a still drawing of an animal starts to feel like an
     animal. That is what a player should be looking at while they wait, and it
     is the same eleven shapes sysCAPY_MARK draws. */
  #boot .orn { display:flex; align-items:center; justify-content:center;
          gap:clamp(8px,2vw,14px); margin-top:clamp(9px,1.8vw,14px); }
  #boot .orn:before, #boot .orn:after { content:""; height:1px; flex:1 1 0;
          max-width:160px; background:linear-gradient(90deg,transparent,rgba(58,51,44,.42)); }
  #boot .orn:after { background:linear-gradient(270deg,transparent,rgba(58,51,44,.42)); }
  #boot .orn svg { display:block; width:clamp(44px,9vw,64px); height:auto;
          transform-origin:50% 100%; }
  @media (prefers-reduced-motion: no-preference) {
    #boot .orn svg { animation:capyboot-breathe 5s ease-in-out infinite; }
  }
  @keyframes capyboot-breathe { 0%,100% { transform:translateY(0) scaleY(1); }
                                50% { transform:translateY(-1px) scaleY(1.035); } }

  /* ---- THE SCREEN A STRANGER GETS WHEN IT DOES NOT START -------------------
     Three different failures — no WebGL, a dependency that never arrived, a
     throw during boot — all used to end in the same place: the words "warming
     up the harbour…" on a pale blue field, for ever, with no way to tell which
     one had happened or whether waiting longer would help. Measured 31 Aug
     2026: block the CDN and the splash sits there silently; take WebGL away
     and it sits there with a monospace stack trace pinned to the bottom of the
     window. Neither is a thing you can hand to somebody.
     This is the same card in the same palette, and it says which of the three
     it was and what to do about it. */
  #boot.failed { transition:none; }
  #boot .fail { display:none; max-width:34em; margin:0 auto; }
  /* the failure is a wider sheet: it is three sentences and a list */
  #boot.failed .sheet { max-width:640px; transform:rotate(-.4deg); }
  #boot.failed .fail { display:block; }
  #boot.failed .sub, #boot.failed .orn { display:none; }
  #boot .fail p { font-size:15px; line-height:1.65; color:#3a332c; margin:14px 0 10px; }
  #boot .fail ul { text-align:left; display:inline-block; margin:2px 0 14px; padding-left:1.1em;
                   font-size:14px; line-height:1.7; color:rgba(58,51,44,.7); }
  /* the card's own accent, its own radius and its own three shadows.
     M6: the FILL is the deep coral, not the bright one. Cream on #e98b7a is
     2.31:1 and this is 12.5px uppercase bold on the one screen a player reaches
     when something has already gone wrong; #9e5f53 is the same hue at 68% value
     and 4.62:1. Hand-copied from systems.js's `accentDeep` on purpose — this
     card has to work before a single module has loaded, which is the whole
     reason it duplicates the palette in the first place. */
  #boot .fail button { font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
          color:#faf6ec; background:#9e5f53; border:1px solid #9e5f53; border-radius:5px;
          padding:10px 22px; letter-spacing:.1em; text-transform:uppercase;
          box-shadow:0 1px 3px rgba(0,0,0,.16),0 6px 16px rgba(0,0,0,.16); }
  #boot .fail button:hover { filter:brightness(1.06); }
  #boot .fail .detail { font:12px/1.5 ui-monospace,Consolas,monospace;
          color:rgba(58,51,44,.5); margin-top:14px; word-break:break-word; }


  #err { position:fixed; left:0; right:0; bottom:0; max-height:45%; overflow:auto; z-index:99;
         background:#3a3229; color:#ffd9a0; font:12px/1.5 ui-monospace,Consolas,monospace;
         padding:10px 14px; white-space:pre-wrap; display:none; }
  /* The developer strip is for a developer. Once the failure card is up, the
     player has been told what happened in words they can use, and a stack trace
     pinned across the bottom of it only makes the same news look worse. The
     console still has all of it, and so does the card's own detail line. */
  #boot.failed ~ #err { display:none !important; }
</style>
</head>
<body>
<div id="boot">
  <div class="sheet">
    <h1>Untitled Capybara Game</h1>
    <div class="sub">warming up the harbour</div>
    <!-- The masthead device: the same eleven shapes as sysCAPY_MARK in
         systems.js, inline because this markup has to draw before a single
         module has been fetched. -->
    <div class="orn" aria-hidden="true">
      <svg viewBox="0 0 34 22" preserveAspectRatio="xMidYMid meet" focusable="false">
        <ellipse cx="15" cy="13.5" rx="11" ry="6.2" fill="#b0784a"/>
        <ellipse cx="6.5" cy="15.5" rx="3.2" ry="4.2" fill="#94603a"/>
        <rect x="8" y="17" width="2.4" height="4" fill="#94603a"/>
        <rect x="19" y="17.5" width="2.4" height="3.5" fill="#94603a"/>
        <circle cx="25" cy="9.5" r="5.4" fill="#c79063"/>
        <ellipse cx="29.6" cy="9.6" rx="2.6" ry="2.2" fill="#b0784a"/>
        <circle cx="22.4" cy="5.2" r="1.9" fill="#8a5a37"/>
        <circle cx="27.2" cy="5" r="1.9" fill="#8a5a37"/>
        <circle cx="26.6" cy="8.4" r="1.1" fill="#2f2118"/>
        <circle cx="31.2" cy="10.2" r="1" fill="#5f3d29"/>
      </svg>
    </div>
    <div class="fail" role="alert">
      <p id="failmsg"></p>
      <ul id="failtips"></ul>
      <div><button type="button" id="failgo">Try again</button></div>
      <div class="detail" id="faildetail"></div>
    </div>
  </div>
</div>
<div id="hud"></div>
<pre id="err"></pre>

<!-- THE TWO LIBRARIES ARE IN THE REPOSITORY, NOT ON A CDN.
     They used to be fetched from jsdelivr at boot. That is one more thing
     between a stranger and the game than there needs to be: an ad-blocker, a
     school or office proxy, a country that does not reach that host, a laptop
     on a train, or ten minutes of jsdelivr being down, and the game does not
     start — silently. Both are MIT and together they are 1.6 MB; they sit in
     vendor/ and are inlined into dist/ by build.mjs. See vendor/README.md. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "cannon-es": "./vendor/cannon-es.js"
  }
}
</script>
<script>
  // ---- BEFORE ANYTHING ELSE: CAN THIS BROWSER DRAW AT ALL? -----------------
  // Asked here rather than inside the renderer because three.js answers it by
  // throwing from 1.3 MB down a stack the player cannot read, and because the
  // answer decides whether loading the rest is worth doing.
  (function () {
    var boot = document.getElementById('boot');
    var shown = false;

    function fail(msg, tips, detail) {
      if (shown) return;
      shown = true;
      window.__capyFailed = true;
      document.getElementById('failmsg').textContent = msg;
      var ul = document.getElementById('failtips');
      ul.innerHTML = '';
      for (var i = 0; i < tips.length; i++) {
        var li = document.createElement('li');
        li.textContent = tips[i];
        ul.appendChild(li);
      }
      document.getElementById('faildetail').textContent = detail || '';
      boot.classList.remove('hidden');
      boot.classList.add('failed');
    }
    window.__capyFail = fail;

    // EXACTLY THE TWO CONTEXTS three.js ASKS FOR, IN ITS ORDER, AND NO MORE.
    // This probe used to fall back to 'experimental-webgl', which some browsers
    // still answer when they will not answer 'webgl' — so the probe passed, the
    // renderer then failed on its own request, and the player got the generic
    // "hit a problem while starting up" card instead of the one that names the
    // cause and tells them to turn hardware acceleration on. A capability check
    // that is more generous than the thing it is checking for is worse than no
    // check at all.
    var canvas = document.createElement('canvas');
    var gl = null;
    try {
      gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    } catch (e) { gl = null; }
    if (!gl) {
      fail('This game draws with WebGL, and this browser could not start it.',
           ['Check that hardware acceleration is switched on in your browser settings.',
            'Try Chrome, Edge, Firefox or Safari, updated to a recent version.',
            'On a desktop, a graphics-driver update often fixes this.'],
           'no WebGL context');
      return;
    }
    // Not fatal — plenty of machines run this fine on a software rasteriser —
    // but worth saying once, because it is the difference between "this game
    // is slow" and "this machine is not using its graphics card".
    try {
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      var r = dbg && gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
      if (/swiftshader|llvmpipe|software/i.test(r)) window.__capySoftGL = r;
    } catch (e) { /* the probe is a courtesy, never a second failure */ }

    // ---- AND IF THE CODE ITSELF NEVER ARRIVES -----------------------------
    // A module script that 404s, or whose bare specifier will not resolve,
    // does not reach window.onerror with anything readable — it simply never
    // runs, and the splash stays up for ever. The watchdog is the only thing
    // that catches all of those at once. main.js clears it the moment the
    // first frame is drawn.
    var t0 = Date.now();
    window.__capyWatchdog = setTimeout(function () {
      if (window.__capyRunning) return;   // it booted, just slowly
      var secs = Math.round((Date.now() - t0) / 1000);
      // Two different failures, and the difference matters to whoever is
      // looking at it: nothing arrived, or it arrived and never drew.
      if (window.__capy) {
        fail('The game loaded but never drew its first frame.',
             ['Reload the page.',
              'If your browser has hardware acceleration switched off, switch it on.',
              'A very old graphics driver can also do this.'],
             'no frame after ' + secs + 's');
      } else {
        fail('The game did not finish loading.',
             ['Check your connection and reload.',
              'If you use an ad-blocker or a strict privacy extension, allow this page and reload.',
              'On a work, school or public network, a proxy may be blocking part of it.'],
             'no boot after ' + secs + 's');
      }
    }, 25000);

    document.getElementById('failgo').addEventListener('click', function () {
      location.reload();
    });
  })();
</script>
<script type="module" src="./src/main.js"></script>
<script>
  // ---- THE DEVELOPER STRIP IS FOR A DEVELOPER, AND IT WAS SHIPPING --------
  // #err is a raw stack-trace panel across the bottom 45% of the screen, and
  // the only thing that ever suppressed it was the boot card already being up
  // (`#boot.failed ~ #err`). Every other window-level throw painted it over a
  // running game: the composite pass, the score's setInterval, and the ~100 DOM
  // handlers in systems.js are all outside the per-module strike system, so a
  // per-frame throw appended ~80 characters sixty times a second into a
  // pre-wrap block that is re-laid-out every frame — the screen covered in a
  // second, and the string growing without bound for as long as the tab lives.
  //
  // So: the strip is opt-in on ?debug, the append is capped, and a repeat is
  // counted rather than re-printed. console.error still gets every one of them
  // in every build, which is where a developer was going to look anyway.
  const errDebug = /[?&]debug\b/.test(location.search);
  let errLast = '', errRepeat = 0;
  function errShow(line) {
    try {
      if (typeof console !== 'undefined' && console.error) console.error(line);
      if (!errDebug) return;
      const el = document.getElementById('err');
      if (!el) return;
      el.style.display = 'block';
      if (line === errLast) {
        errRepeat++;
        el.textContent = el.textContent.replace(/(?: \(x\d+\))?\n$/, ' (x' + (errRepeat + 1) + ')\n');
        return;
      }
      errLast = line; errRepeat = 0;
      // 8 kB is about eighty distinct failures, which is far past the point
      // where the eighty-first one tells anybody anything new.
      if (el.textContent.length > 8000) el.textContent = '… earlier errors dropped …\n';
      el.textContent += line + '\n';
    } catch (x) { /* the error reporter may not fail louder than the error */ }
  }
  window.addEventListener('error', e => {
    errShow((e.message || e.error) + '\n  ' + (e.filename||'') + ':' + (e.lineno||''));
    // A throw before the game object exists is a boot failure, not a bad
    // frame: nothing is on screen to go back to, so say so in words.
    if (!window.__capy && window.__capyFail) {
      window.__capyFail('The game hit a problem while starting up.',
        ['Reload the page — this is often a one-off.',
         'If it keeps happening, try another browser, or a private window with extensions off.'],
        String(e.message || e.error || '').slice(0, 200));
    }
  });
  window.addEventListener('unhandledrejection', e => {
    errShow('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
</script>
</body>
</html>

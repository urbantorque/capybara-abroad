# THE SHAREABLE LINK. Every push to master builds the one-file game (node
# build.mjs → dist/untitled-capybara-game.html) and publishes it as the
# repository's GitHub Pages site, at the root, as index.html — so the URL a
# friend gets is the game and nothing else. No dependencies: the two libraries
# are checked in under vendor/ and the build is a single node script.
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - run: |
          mkdir -p site
          cp dist/untitled-capybara-game.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
